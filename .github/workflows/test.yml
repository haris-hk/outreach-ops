name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm ci --ignore-scripts
      - name: Dependency sanity
        run: node -e "import('js-yaml').then(() => console.log('js-yaml resolves')).catch((e) => { console.error(e.message); process.exit(1); })"
      - run: node engine/test-all.mjs --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
