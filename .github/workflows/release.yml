name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual re-fire of the npm publish (e.g. after fixing trusted-publisher config)

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm --provenance attestation via GitHub OIDC

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publish the npm scaffolder only when a release was just created.
      # Runs in the same job because a release created via GITHUB_TOKEN does
      # not trigger separate `on: release` workflows.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          node-version: 24
          # NOTE: no registry-url here on purpose. setup-node's registry-url
          # writes an .npmrc _authToken=${NODE_AUTH_TOKEN} line; with no token
          # env (we publish via OIDC trusted publishing) npm sees an empty
          # credential and skips the OIDC exchange entirely.
      - name: Publish scaffolder to npm
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        # Tokenless publish via npm Trusted Publishing (GitHub OIDC).
        # Requires the trusted-publisher config on the npm package settings
        # (GitHub Actions · haris-hk/outreach-ops · release.yml). No NPM_TOKEN.
        run: npm publish --provenance --access public
        working-directory: scaffolder
