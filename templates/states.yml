# Outreach-Ops — Canonical Lead States
# Source of truth for the ledger (writer) and dashboard (reader).
#
# Rule: the Status cell in data/leads.md must contain EXACTLY one of these
# values (case-insensitive). No markdown bold, no dates, no extra text.
# dashboard_group values are the TUI's grouping buckets.

states:
  - id: new
    label: New
    aliases: [inbox]
    description: Surfaced by a scan or added manually; not yet graded
    dashboard_group: evaluated

  - id: graded
    label: Graded
    aliases: [evaluated, evaluada]
    description: A-G grade complete; awaiting go/no-go decision
    dashboard_group: evaluated

  - id: queued
    label: Queued
    aliases: [ready]
    description: Passed threshold + contact verified + spam preflight; ready for human review
    dashboard_group: evaluated

  - id: drafted
    label: Drafted
    aliases: []
    description: Outreach drafts written, not yet approved for the queue
    dashboard_group: evaluated

  - id: sent
    label: Sent
    aliases: [applied, contacted]
    description: Human reviewed and sent the first touch
    dashboard_group: applied

  - id: bumped
    label: Bumped
    aliases: [followed_up, followup]
    description: Follow-up touch sent per cadence
    dashboard_group: applied

  - id: replied
    label: Replied
    aliases: [responded, respondido]
    description: Prospect responded (any sentiment)
    dashboard_group: responded

  - id: call
    label: Call
    aliases: [meeting, interview]
    description: Call or meeting booked / in progress
    dashboard_group: interview

  - id: won
    label: Won
    aliases: [offer, closed_won, hired]
    description: Deal closed / role landed
    dashboard_group: offer

  - id: lost
    label: Lost
    aliases: [rejected, closed_lost]
    description: Explicit no, or went with someone else
    dashboard_group: rejected

  - id: nurture
    label: Nurture
    aliases: [monitor, watch]
    description: Graded 3.0-3.4 — watch for a better trigger, do not contact
    dashboard_group: skip

  - id: disqualified
    label: Disqualified
    aliases: [skip, no_contact, descartado]
    description: Below threshold or never-contact; do not draft
    dashboard_group: skip
