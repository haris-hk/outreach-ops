# Copy to profile/preferences.yml. How the system behaves for YOU.
channels:                       # per-segment override of channel_default
  seed-ai-startups: email
tone: "direct, technical, warm; no exclamation marks; no emojis"
dm_max_chars: 300
never_contact:                  # domains or names never to draft for
  - example-competitor.com
cadence:
  max_touches: 3
  min_gap_days: 4
  quiet_days: [sat, sun]
contact_threshold: 3.5          # below this grade: no send-ready drafts
learning:
  auto_apply_weight_changes: false   # review mode proposes; you approve
