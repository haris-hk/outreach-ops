# Copy to profile/icp.yml. Who you hunt, and what makes NOW the right time.
segments:
  - id: seed-ai-startups
    firmo:
      size: [3, 50]
      stage: [pre-seed, seed, series-a]
      industry: [ai, saas, fintech]
      geo: [us, eu, remote]
    roles: [Founder, CTO, Head of Engineering]     # who to reach inside
    triggers:                                       # what makes a lead timely
      - raised_round
      - hiring_for: [ml, ai, backend]
      - launched_product
    channel_default: email
    notes: "hiring for ML but no ML lead = strongest signal"

watchlists:
  companies:               # named accounts monitored every scan
    # - { name: NovaStack, careers_url: "https://jobs.ashbyhq.com/novastack", github_org: novastack, domain: novastack.io }
    []
  sources:                 # provider-driven discovery (docs/ADDING_PROVIDERS.md)
    # - { provider: hn-launches, query: "ai agents" }
    # - { provider: directories, seed: yc, batch: W26, keyword: ai }
    # - { provider: funding, feeds: ["https://example-tradepress.com/funding/feed"] }
    # - { provider: news-rss, rss: "https://blog.targetco.com/feed", company: TargetCo }
    []
