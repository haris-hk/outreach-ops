<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url('../fonts/space-grotesk-latin.woff2') format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'DM Sans'; src: url('../fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 400 700; }
  @page { size: A4; margin: 14mm 16mm; }
  :root { --ink: #1a1d23; --muted: #5c6470; --accent: #0f6b54; --line: #e3e6ea; --chip: #eef4f1; }
  * { box-sizing: border-box; }
  body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); font-size: 10.5pt; line-height: 1.45; margin: 0; }
  h1, h2, h3 { font-family: 'Space Grotesk', system-ui, sans-serif; margin: 0 0 4pt; }
  h1 { font-size: 19pt; }
  h2 { font-size: 12.5pt; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 2pt; margin-top: 12pt; }
  h3 { font-size: 11pt; margin-top: 8pt; }
  a { color: var(--accent); text-decoration: none; }
  .meta { display: flex; gap: 8pt; flex-wrap: wrap; margin: 6pt 0 2pt; }
  .chip { background: var(--chip); color: var(--accent); border-radius: 10pt; padding: 1.5pt 8pt; font-size: 9pt; font-weight: 600; }
  .grade { font-family: 'Space Grotesk'; font-weight: 700; font-size: 15pt; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin: 6pt 0; font-size: 9.5pt; }
  th, td { border: 1px solid var(--line); padding: 3.5pt 6pt; text-align: left; vertical-align: top; }
  th { background: var(--chip); font-family: 'Space Grotesk'; font-size: 9pt; }
  ul { margin: 4pt 0; padding-left: 14pt; }
  li { margin: 1.5pt 0; }
  blockquote { border-left: 3px solid var(--accent); margin: 6pt 0; padding: 2pt 10pt; color: var(--muted); }
  .footer { position: fixed; bottom: -8mm; left: 0; right: 0; font-size: 8pt; color: var(--muted); text-align: center; }
  code { background: var(--chip); padding: 0 3pt; border-radius: 3pt; font-size: 9pt; }
</style>
</head>
<body>
{{CONTENT}}
<div class="footer">{{FOOTER}}</div>
</body>
</html>
